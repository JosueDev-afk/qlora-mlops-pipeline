[project]
name = "qlora-mlops-pipeline"
version = "0.1.0"
description = "An automated MLOps pipeline for building datasets and fine-tuning domain-specialized LLMs for task-oriented voice agents (es-MX)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
# Zone 1 — data construction and training. Needs Spark; training needs a GPU.
pipeline = [
    "pyspark==3.5.1",
    "delta-spark==3.2.0",
    "datasets>=2.19",
    "huggingface-hub>=0.23",
    "great-expectations>=0.18",
    "dvc>=3.51",                # local remote next to the repo (see README)
    "mlflow>=2.13",
    "apache-airflow==2.9.2",
    "datasketch>=1.6",          # MinHash / LSH
]
train = [
    "torch>=2.3",
    "transformers>=4.42",
    "peft>=0.11",
    "trl>=0.9",
    "bitsandbytes>=0.43",
    "accelerate>=0.31",
    "xgboost>=2.0",
    "scikit-learn>=1.5",
    "laya>=0.3.20",             # decision model, Tasks B and D
]
# Zone 2 — runtime. Latency-sensitive: no Spark, no torch.
agent = [
    "langgraph>=0.1",
    "langchain-core>=0.2",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "confluent-kafka>=2.4",
    "websockets>=13.0",         # Scribe v2 Realtime STT; ElevenLabs spoken directly, no SDK
    "openai>=1.35",             # OpenAI-compatible client for vLLM
    "pipecat-ai>=0.0.50",       # real-time audio layer over WebRTC (demo)
]
# Zone 3 — model servers. torch lives here, never in the agent, which calls
# both models over HTTP on the same reference GPU (fair latency for H1).
serve = [
    "vllm>=0.8",                # Qwen + QLoRA adapter, OpenAI-compatible API
    "laya[serve]>=0.3.20",      # decision model over its own /v1/systemone server
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
    "jupyterlab>=4.2",          # notebooks/ exploration; rule 7: never imported
    "ipykernel>=6.29",          # lets notebooks use the project's virtualenv
    "httpx>=0.27",              # unit-test the agent speech adapters without the agent group
    "websockets>=13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires running infrastructure"]
