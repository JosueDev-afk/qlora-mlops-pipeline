stages:
  ingest:
    # Bronze is rebuilt byte for byte from the pins in params.yaml, so DVC
    # tracks its hashes without caching a copy (3x disk on a 16 GB laptop).
    # persist: bronze is append-only and must survive a repro.
    cmd: python -m src.pipeline.ingest.run --out data/bronze
    deps: [src/pipeline/ingest]
    params: [ingest.sources]
    outs:
      - data/bronze:
          cache: false
          persist: true

  curate:
    cmd: python -m src.pipeline.curate.run --in data/bronze --out data/silver
    deps: [src/pipeline/curate, data/bronze]
    outs: [data/silver]

  generate:
    cmd: python -m src.pipeline.synth.run --out data/synthetic
    deps: [src/pipeline/synth]
    params: [synth.n_dialogues, synth.personas, synth.seed, synth.carrier_phrases]
    outs: [data/synthetic]

  augment:
    cmd: python -m src.pipeline.augment.run --out data/augmented
    deps: [src/pipeline/augment, data/silver, data/synthetic]
    params: [augment.method, augment.wer_levels, augment.variants_per_dialogue]
    outs: [data/augmented]

  build_gold:
    cmd: python -m src.pipeline.datasets.build_gold --out data/gold
    deps: [src/pipeline/datasets, data/augmented]
    params: [gold.template_ratio, gold.replay_ratio, gold.target_size]
    outs: [data/gold]

  train_laya:
    cmd: python -m src.pipeline.train.laya --dataset data/gold --out models/laya
    deps: [src/pipeline/train/laya.py, data/gold]
    params: [laya.checkpoint, laya.learning_rate, laya.epochs]
    outs: [models/laya]

  calibrate_laya:
    # Writes temperatures and the derived call_rejected threshold. Kept outside
    # models/laya, which belongs to the train_laya stage.
    cmd: python -m src.pipeline.calibrate.fit_temperature --model models/laya --out models/laya_calibration.json
    deps: [src/pipeline/calibrate, models/laya, data/calibration]
    params: [calibration.method, calibration.max_ece, calibration.split, calibration.target_recall]
    outs: [models/laya_calibration.json]
    metrics: [evaluation/reports/calibration.json]
