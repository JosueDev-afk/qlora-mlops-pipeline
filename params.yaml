# Everything runs on the maintainer's MacBook Air M4 (16 GB) except GPU work,
# which runs on Colab. Spark runs in local mode and leaves room for Docker.
# Not a lineage parameter: it changes speed, never outputs, so DVC ignores it.
spark:
  master: local[*]
  driver_memory: 6g

# Public corpora downloaded raw into data/bronze/<source>/ingest_date=<date>/.
# Every source is pinned (a Hub commit or a sha256), so bronze can always be
# rebuilt byte for byte. `verified` is the maintainer's license check from
# docs/DATA_PROVENANCE.md: ingest refuses a source until it is true.
ingest:
  sources:
    massive:
      kind: url                 # the Hub repo only holds a loading script
      url: https://amazon-massive-nlu-dataset.s3.amazonaws.com/amazon-massive-dataset-1.1.tar.gz
      sha256: 4cba5faa11c71437928e17cb1b9b3d8b8e727e7ea363a3a9a8045e19c0491577
      license: cc-by-4.0
      purpose: intents in Spanish (es-ES locale, used as is)
      verified: false
    callcenter_en:
      kind: hf_dataset
      repo_id: AIxBlock/92k-real-world-call-center-scripts-english
      revision: 9d40ca13f3e173ad815c89bb8fff144be3ae3146
      license: cc-by-nc-4.0     # non-commercial; the card forbids commercial use
      purpose: ASR confidence and disfluency profile for augmentation
      verified: false
    ciempiess_light:
      kind: hf_dataset
      repo_id: ciempiess/ciempiess_light
      revision: 3d6afb2b3b8dd00ad8f5b1288fe4c18f5882faaa
      license: cc-by-sa-4.0     # share-alike
      purpose: es-MX audio for the Scribe v2 error profile
      verified: false
    # spanish_instructions: replay data (H5b), still to be chosen and audited.

synth:
  n_dialogues: 30000
  seed: 42
  personas: [cooperative, rushed, distracted, suspicious, hard_of_hearing, monosyllabic]
  flows: [validate_contact, confirm_appointment]
  # Task D: overlapped fragments, generated with their position inside the
  # agent's utterance — that is the context the model sees in production.
  backchannels: ["ajá", "mhm", "sí sí", "órale", "ándele", "okey", "va", "claro"]
  real_interruptions: ["no, espérese", "ese no es mi correo", "perdón, me equivoqué", "a ver, repítame"]
  # Carrier phrases are the only LLM-written text in the corpus. Everything else
  # is generated by code from its label, so labels are correct by construction.
  carrier_phrases:
    target_count: 1500            # 1,000–2,000, reviewed by a native speaker
    generator: Qwen/Qwen3-8B      # open model, no Cloud billing; larger than the arms under test

augment:
  method: rules                 # phonetic confusion tables; CPU only
  wer_levels: [0.05, 0.10, 0.15, 0.25]
  variants_per_dialogue: 10
  emphasis: alphanumeric        # emails and phone numbers are the failure point

gold:
  tag: gold-v1                  # single source of truth: train_qlora and
                                # train_laya must consume the same tag for H1
                                # to be a comparison of models, not of data
  target_size: 8000
  template_ratio: 0.75          # template vs LLM-paraphrased; swept in H4 (0.25/0.5/0.75/1.0)
  replay_ratio: 0.15            # general instruction data, guards against rigidity (H5b)
  splits: {train: 0.8, val: 0.1, test: 0.1}

train:
  base_model: Qwen/Qwen3-4B     # Apache-2.0. Qwen2.5-3B is research-license only.
  size_arm: Qwen/Qwen3-1.7B     # H5a: same family as the 4B, so only size changes
  enable_thinking: false        # reasoning tokens would spend the 500 ms budget
  # classify_intent is trained only as the generative arm of H1; at runtime
  # Task B stays on Laya.
  tasks: [extract_entity, parse_datetime, classify_intent]
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  learning_rate: 2.0e-4
  epochs: 2
  max_seq_length: 2048
  early_stopping_patience: 2

# Decision model (Tasks B and D). Trained from the same gold tag as the
# generative model so Hypothesis 1 is a fair comparison.
laya:
  checkpoint: convaiinnovations/laya-multilingual   # never the English root
  learning_rate: 1.0e-5
  epochs: 3
  batch_size: 32
  max_len: 1024
  head_max_len: 256

calibration:
  method: temperature_scaling
  # One temperature per Laya bucket: question type x options (2, 3-5, 6-10, 11+).
  # Fitted values must lie in [0.5, 5.0]: Laya clamps anything outside, and the
  # server refuses a file it would alter.
  per: [question_type, option_bucket]
  max_ece: 0.10                     # the DAG fails above this
  # The call_rejected threshold is derived, never set: calibrate_laya picks it
  # from the PR curve on the calibration split to reach this recall (H6).
  target_recall: 0.95
  split: data/calibration           # human-annotated; never gold (mostly synthetic), never the eval set
  folds: 5                          # the gate is held-out ECE, never ECE on the data T was fitted to
  min_per_bucket: 50                # fewer examples is an error, not a temperature fitted on noise
  seed: 42

# H1/H1b frontier arm: the only non-local component. Gemini API free tier, no
# billing. Free-tier inputs may be used by Google, so only the frozen eval set
# (no personal data) is sent, and the paper discloses it.
evaluation:
  frontier_arm:
    provider: gemini
    tier: free

# Latency is only comparable on fixed hardware and a shared serving path:
# both models run in src/serving/ and are reached over HTTP. The Mac has no
# CUDA (vLLM, bitsandbytes), so the reference GPU is a Colab L4.
serving:
  reference_gpu: L4
  budget_ms:
    end_to_end: 800               # end of turn detected -> first agent audio
    generative_json: 500          # Qwen until the JSON is complete, not first token

# Real-time audio layer. Demo only: hypotheses are evaluated offline on
# transcripts, so this layer never affects the measurements.
audio:
  transport: webrtc
  framework: pipecat
  interruption_threshold: 0.4       # P(real) to stop TTS; must stay < 0.5 (when in doubt,
                                    # interrupt). Replace with the PR-curve value
  early_rejection_threshold: 0.5    # on ASR partials only; demo, never evaluated
