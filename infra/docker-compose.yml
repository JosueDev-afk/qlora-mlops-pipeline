# Local stack for a 16 GB MacBook Air M4 (arm64). Never run every profile at once.
#
#   core (no profile)  postgres                       always on, ~0.3 GB
#   pipeline           airflow (Spark runs in-process, local[*]) + mlflow
#   streaming          kafka (KRaft, no ZooKeeper)
#   bi                 metabase
#   hdfs               namenode + datanode, amd64 only (emulated on Apple Silicon)
#
# No object store: MinIO stopped publishing images in Oct 2025. The lake is
# data/{bronze,silver,gold} on disk, which DVC already versions; the hdfs
# profile exists for the Big Data rubric and keeps no data between restarts.
#
# Use the Makefile: `make up PROFILES="pipeline streaming"`.

name: qlora-mlops

x-airflow: &airflow
  build:
    context: ..
    dockerfile: infra/airflow/Dockerfile
  image: qlora-mlops/airflow:local
  profiles: [pipeline]
  env_file: ../.env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor  # no Celery, no Redis: saves ~1 GB
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    PYTHONPATH: /opt/project
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - ..:/opt/project  # dags, src, params.yaml and data/ straight from the repo
  working_dir: /opt/project
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    env_file: ../.env
    ports: ["5432:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init/postgres-databases.sql:/docker-entrypoint-initdb.d/00-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    mem_limit: 512m

  airflow-init:
    <<: *airflow
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-changeme}
    restart: "no"

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 1536m

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    # Tasks run here (LocalExecutor), including Spark in local mode with a 6 GB
    # driver (params.yaml: spark.driver_memory). Leave headroom above it.
    mem_limit: 8g

  mlflow:
    build:
      context: ..
      dockerfile: infra/mlflow/Dockerfile
    image: qlora-mlops/mlflow:local
    profiles: [pipeline]
    ports: ["5000:5000"]
    volumes:
      - mlflow:/mlflow
    # Artifacts are proxied by the server (--serve-artifacts), so clients need
    # no shared volume or object store.
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
    mem_limit: 768m

  kafka:
    image: apache/kafka:4.3.1
    profiles: [streaming]
    ports: ["29092:29092"]  # host clients use localhost:29092; containers use kafka:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka:/var/lib/kafka/data
    mem_limit: 1g

  metabase:
    image: metabase/metabase:v0.63.x
    profiles: [bi]
    ports: ["3000:3000"]
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_OPTS: -Xmx1g
    volumes:
      - metabase:/metabase-data
    mem_limit: 1536m

  namenode:
    image: apache/hadoop:3.4.2
    platform: linux/amd64  # no arm64 build exists; runs under emulation
    profiles: [hdfs]
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports: ["9870:9870"]
    env_file: ./hadoop/config
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-hadoop/dfs/name
    mem_limit: 1g

  datanode:
    image: apache/hadoop:3.4.2
    platform: linux/amd64
    profiles: [hdfs]
    command: ["hdfs", "datanode"]
    env_file: ./hadoop/config
    depends_on: [namenode]
    mem_limit: 1g

volumes:
  postgres:
  mlflow:
  kafka:
  metabase:
