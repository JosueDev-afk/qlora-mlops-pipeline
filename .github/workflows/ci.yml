name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: ruff check src dags tests
      - run: mypy src
      - run: pytest tests/unit -q

  evaluate:
    # Runs the frozen eval set on every PR and comments the metrics.
    # Disabled: the DVC remote is a local directory, which CI cannot reach.
    # Re-enable once the eval set lives somewhere CI can pull from; until then
    # evaluation runs locally with `make eval`.
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev,pipeline]"
      - name: Pull frozen eval set
        run: dvc pull evaluation/eval_set
      - name: Evaluate registered model
        run: python -m src.pipeline.evaluate.run --report evaluation/reports/pr.md
      - uses: marocchino/sticky-pull-request-comment@v2
        with: { path: evaluation/reports/pr.md }
